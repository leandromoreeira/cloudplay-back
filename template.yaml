AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  aws-jam

  Sample SAM Template for aws-jam

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 30
    Environment:
      Variables:
        GAMES_TABLE: !Ref GamesTable
        GAME_SESSIONS_TABLE: !Ref GameSessionsTable
        GAME_ACCESS_TABLE: !Ref GameAccessTable
        GAME_ACCOUNTS_TABLE: !Ref GameAccountsTable
        S3_BUCKET_NAME: !Ref S3BucketName
        ALERT_EMAIL: !Ref AlertEmail

Parameters:
  S3BucketName:
    Type: String
    Default: "cloudraiser-673000199571"

  OrganizationId:
    Type: String
    Description: >
      Organization ID (o-xxxx). Scopes the cross-account AssumeRole permission
      to accounts inside this organization, which is what makes the account
      wildcard below safe.
    AllowedPattern: "^o-[0-9a-z]{10,32}$"
    Default: "o-prvoj7g1n5"

  GameAccountRoleName:
    Type: String
    Default: CloudPlayGameRole
    Description: >
      Role the orchestrator assumes in accounts vended by manage_accounts.py.
      Must match the role name in org/organization.yaml.

  PlayerRoleName:
    Type: String
    Default: HengHaTeamRole
    Description: >
      Role players are signed in to their game account as. Must match
      ROLE_NAME in layers/utils-layer/team_role.py and PlayerRoleName in
      org/organization.yaml.

  AlertEmail:
    Type: String
    Default: leandro.lx3@gmail.com
    Description: >
      Where the alert goes when an account falls out of the pool, and the SES
      identity it is sent from. Sender and recipient are the same address on
      purpose: SES in the sandbox only delivers between verified identities,
      so one verification covers both ends. Cognito does not use this — it
      sends invitations and password resets with its own sender.

  SessionHours:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 720
    Description: >
      How long a sign-in lasts before the player has to authenticate again,
      second factor included. This is the refresh token's lifetime; the access
      and ID tokens keep the usual hour and are renewed from it.

  MfaEnforcement:
    Type: String
    Default: "ON"
    AllowedValues: ["OFF", "OPTIONAL", "ON"]
    Description: >
      An authenticator app is the only second factor enabled. With this ON,
      a user who has not enrolled one is walked through enrolling it on their
      next sign-in.

  MaxSessionHours:
    Type: Number
    Default: 3
    MinValue: 1
    Description: >
      How long a session may hold an account before the janitor tears it down.
      A player who closes the tab never ends their session, and an abandoned
      session is an account permanently out of the pool.

Resources:

  UtilsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-utils-layer"
      Description: Shared utilities for game management including account_manager
      ContentUri: layers/utils-layer/
      CompatibleRuntimes:
        - python3.9
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.9

  GamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Games"
      AttributeDefinitions:
        - AttributeName: "id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "id"
          KeyType: "HASH"
      BillingMode: PAY_PER_REQUEST

  GameSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Game-Sessions"
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: user_name
          AttributeType: S
        - AttributeName: game_id
          AttributeType: S
        - AttributeName: account_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_game_index
          KeySchema:
            - AttributeName: user_name
              KeyType: HASH
            - AttributeName: game_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Used by the cleanup result handler to find the session a finished
        # build belongs to, which it only knows by account.
        - IndexName: account_index
          KeySchema:
            - AttributeName: account_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  # Pool of AWS accounts games get deployed into. One item per account, holding
  # the account's lifecycle state (AVAILABLE / IN_USE / CLEANING / QUARANTINED)
  # so an account being torn down is never handed to a new player.
  GameAccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Game-Accounts"
      AttributeDefinitions:
        - AttributeName: "account_id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "account_id"
          KeyType: "HASH"
      BillingMode: PAY_PER_REQUEST

  # Creating this sends a verification mail to the address. Until someone
  # clicks it, SES refuses to send and the quarantine alert only reaches the
  # Lambda's log. The state change itself is unaffected.
  AlertEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref AlertEmail

  GameAccessTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Game-Access"
      AttributeDefinitions:
        - AttributeName: "user_email"
          AttributeType: "S"
        - AttributeName: "game_id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "user_email"
          KeyType: "HASH"
        - AttributeName: "game_id"
          KeyType: "RANGE"
      BillingMode: PAY_PER_REQUEST

  GetGamesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/get_games/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GamesTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccessTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /games
            Method: get
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  GetGameByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/get_game_by_id/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GamesTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccessTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /games/{gameId}
            Method: get
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  GetGameSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/get_game_session/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - AWSCloudFormationFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccessTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccountsTable
        - Version: "2012-10-17"
          Statement:
            # Wildcard on the account, specific on the role name, confined to
            # this organization. Adding an account never touches this template.
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub "arn:aws:iam::*:role/${GameAccountRoleName}"
              Condition:
                StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /games/{gameId}/session
            Method: get
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  StartGameSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/start_game_session/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - AWSCloudFormationFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccessTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccountsTable
        - AmazonS3ReadOnlyAccess
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub "arn:aws:iam::*:role/${GameAccountRoleName}"
              Condition:
                StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /games/{gameId}/start
            Method: post
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  EndGameSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/end_game_session/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Environment:
        Variables:
          CLEANUP_PROJECT_NAME: !Ref AccountCleanupProject
      # No longer deletes the stack or reaches into the game account: it ends
      # the session and hands the account to the cleanup build.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccessTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccountsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: codebuild:StartBuild
              Resource: !GetAtt AccountCleanupProject.Arn
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${AlertEmail}"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub "arn:aws:iam::*:role/${GameAccountRoleName}"
              Condition:
                StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /games/{gameId}/end
            Method: post
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  SubmitTaskAnswerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/submit_task_answer/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GamesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccessTable
        # Which role to assume is stored per account. Without this the lookup
        # fails and every validation silently falls back to the default name.
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccountsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: "*"  # Allow invoking any lambda (validate_task functions)
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub "arn:aws:iam::*:role/${GameAccountRoleName}"
              Condition:
                StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /games/{gameId}/tasks/{taskId}/answer
            Method: post
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer


  GetAccountStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/get_account_status/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccountsTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /accounts/status
            Method: get
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  # Wipes a game account after its session ends. CloudFormation delete leaves
  # behind anything the player created or modified outside the stack, so the
  # account is swept instead of the stack being deleted.
  AccountCleanupProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-account-cleanup"
      Description: Runs aws-nuke against a single game account
      ServiceRole: !GetAtt AccountCleanupRole.Arn
      # Labs with databases, EKS clusters and the like take a long time to
      # tear down, so this is generous on purpose.
      TimeoutInMinutes: 60
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: TARGET_ACCOUNT
            Value: "unset"
          - Name: GAME_ACCOUNTS_TABLE
            Value: !Ref GameAccountsTable
          - Name: GAME_ACCOUNT_ROLE_NAME
            Value: !Ref GameAccountRoleName
          # Lives in the cloudraiser-games repo (nuke/aws-nuke.yaml) and gets
          # here with the normal games sync, so it is versioned alongside the
          # game templates rather than in this one.
          - Name: NUKE_CONFIG_S3
            Value: !Sub "s3://${S3BucketName}/nuke/aws-nuke.yaml"
          - Name: AWS_NUKE_VERSION
            Value: "3.68.3"
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - set -eu
                # Refuse to wipe an account the orchestrator has not put into
                # CLEANING. Without this, a hand-started build could sweep an
                # account that is mid-session.
                - |
                  STATUS=$(aws dynamodb get-item \
                      --table-name "$GAME_ACCOUNTS_TABLE" \
                      --key "{\"account_id\":{\"S\":\"$TARGET_ACCOUNT\"}}" \
                      --query 'Item.status.S' --output text)
                  if [ "$STATUS" != "CLEANING" ]; then
                    echo "Account $TARGET_ACCOUNT is '$STATUS', expected CLEANING. Refusing to run."
                    exit 1
                  fi
                - |
                  curl -sSLf -o /tmp/aws-nuke.tar.gz \
                    "https://github.com/ekristen/aws-nuke/releases/download/v${AWS_NUKE_VERSION}/aws-nuke-v${AWS_NUKE_VERSION}-linux-amd64.tar.gz"
                - tar -xzf /tmp/aws-nuke.tar.gz -C /usr/local/bin aws-nuke
                - aws s3 cp "$NUKE_CONFIG_S3" /tmp/base.yaml
                # The base config carries no account list; scope this run to
                # exactly the account we were handed.
                - |
                  { cat /tmp/base.yaml
                    printf '\naccounts:\n  "%s":\n    presets:\n      - access\n      - defaults\n' "$TARGET_ACCOUNT"
                    printf '\nbypass-alias-check-accounts:\n  - "%s"\n' "$TARGET_ACCOUNT"
                  } > /tmp/nuke.yaml
            build:
              commands:
                - |
                  aws-nuke run -c /tmp/nuke.yaml \
                    --assume-role-arn "arn:aws:iam::${TARGET_ACCOUNT}:role/${GAME_ACCOUNT_ROLE_NAME}" \
                    --default-region us-east-1 \
                    --no-alias-check --no-prompt --no-dry-run \
                    --max-wait-retries 5 --quiet

  AccountCleanupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: account-cleanup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-account-cleanup*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/nuke/*"
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt GameAccountsTable.Arn
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:aws:iam::*:role/${GameAccountRoleName}"
                Condition:
                  StringEquals:
                    aws:ResourceOrgID: !Ref OrganizationId

  # The build itself never writes account state. This owns that transition, so
  # a build that times out or is stopped still releases or quarantines the
  # account instead of leaving it stuck in CLEANING forever.
  CleanupResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/cleanup_result/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${AlertEmail}"
      Architectures:
        - x86_64
      Events:
        BuildStateChange:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.codebuild
              detail-type:
                - CodeBuild Build State Change
              detail:
                project-name:
                  - !Sub "${AWS::StackName}-account-cleanup"
                build-status:
                  - SUCCEEDED
                  - FAILED
                  - STOPPED
                  - TIMED_OUT

  # Nothing ends a session when a player just closes the tab, and an account
  # held by an abandoned session never comes back on its own. This sweeps them
  # through exactly the same teardown the player's "end" button triggers.
  SessionJanitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/session_janitor/
      Handler: app.lambda_handler
      Runtime: python3.9
      # A sweep can start several builds in a row, which the 30s default in
      # Globals is too tight for.
      Timeout: 120
      Layers:
        - !Ref UtilsLayer
      Environment:
        Variables:
          CLEANUP_PROJECT_NAME: !Ref AccountCleanupProject
          MAX_SESSION_HOURS: !Sub "${MaxSessionHours}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccountsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: codebuild:StartBuild
              Resource: !GetAtt AccountCleanupProject.Arn
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${AlertEmail}"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub "arn:aws:iam::*:role/${GameAccountRoleName}"
              Condition:
                StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
      Architectures:
        - x86_64
      Events:
        Sweep:
          Type: Schedule
          Properties:
            # A session therefore lives somewhere between MaxSessionHours
            # and 30 minutes past it, which is close enough for a 3h cap.
            Schedule: rate(30 minutes)
            Description: Expire game sessions that outlived MaxSessionHours

  # Cognito says who the caller is; this says whether they still hold the
  # account, and only then trades that for a console session. Sessions last
  # an hour: assuming a role from a Lambda is role chaining, which AWS caps
  # there. The console sends the player to FRONTEND_URL/reconnect when it
  # expires, and that page asks for a fresh URL.
  ConsoleAccessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/console_access/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Environment:
        Variables:
          FRONTEND_URL: !Sub "https://${CloudFrontDistribution.DomainName}"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccessTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccountsTable
        - Version: "2012-10-17"
          Statement:
            # The player's role, not the orchestrator's: this session is the
            # person, and CloudTrail in the game account records it as them.
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub "arn:aws:iam::*:role/${PlayerRoleName}"
              Condition:
                StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /games/{gameId}/console
            Method: post
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-OAC"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Action:
              - s3:GetObject
            Effect: Allow
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"
            Principal:
              Service: cloudfront.amazonaws.com
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_100

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      AutoVerifiedAttributes:
        - email

      # Email is free to be the way back in when a password is lost, because
      # the second factor below is an authenticator app and not the mailbox.
      # Cognito's own sender handles these, so the pool needs no SES identity
      # and is not held back by the SES sandbox.
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

      # An authenticator app, deliberately not email: a code in a mailbox is
      # only as strong as the mailbox, and sending it would have meant SES
      # production access and a domain we do not have.
      MfaConfiguration: !Ref MfaEnforcement
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA

  FullAccessUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref CognitoUserPool
      GroupName: full-access
      Description: Users who can see and play every game, bypassing per-game access grants

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: !Sub "${AWS::StackName}-user-pool-client"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # The refresh token is what decides how long a sign-in survives: once it
      # expires the player authenticates again, second factor included. The
      # short-lived tokens are renewed from it in the meantime.
      RefreshTokenValidity: !Ref SessionHours
      AccessTokenValidity: 1
      IdTokenValidity: 1
      TokenValidityUnits:
        RefreshToken: hours
        AccessToken: hours
        IdToken: hours

Outputs:
  GamesApi:
    Description: "API Gateway endpoint URL for Prod stage for Games functions"
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/games/"

  BucketName:
    Description: "S3 bucket for the frontend"
    Value: !Ref FrontendBucket

  BucketURL:
    Description: "URL for the frontend"
    Value: !GetAtt FrontendBucket.WebsiteURL

  CloudFrontURL:
    Description: "CloudFront URL for the frontend"
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref CognitoUserPool

  UserPoolClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref CognitoUserPoolClient