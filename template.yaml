AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  aws-jam

  Sample SAM Template for aws-jam

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 30
    Environment:
      Variables:
        GAMES_TABLE: !Ref GamesTable
        GAME_SESSIONS_TABLE: !Ref GameSessionsTable
        GAME_ACCESS_TABLE: !Ref GameAccessTable
        GAME_ACCOUNTS_TABLE: !Ref GameAccountsTable
        GAME_PROGRESS_TABLE: !Ref GameProgressTable
        STACK_EVENTS_TOPIC_ARN: !Ref StackEventsTopic
        ALLOWED_ORIGIN: !If
          - UseOwnFrontend
          - !Sub "https://${CloudFrontDistribution.DomainName}"
          - !Ref AllowedOrigin
        S3_BUCKET_NAME: !Ref S3BucketName
        ALERT_EMAIL: !Ref AlertEmail

Parameters:
  S3BucketName:
    Type: String
    Default: "cloudraiser-673000199571"

  OrganizationId:
    Type: String
    Description: >
      Organization ID (o-xxxx). Scopes the cross-account AssumeRole permission
      to accounts inside this organization, which is what makes the account
      wildcard below safe.
    AllowedPattern: "^o-[0-9a-z]{10,32}$"
    Default: "o-prvoj7g1n5"

  GameAccountRoleName:
    Type: String
    Default: CloudPlayGameRole
    Description: >
      Role the orchestrator assumes in accounts vended by manage_accounts.py.
      Must match the role name in org/organization.yaml.

  PlayerRoleName:
    Type: String
    Default: HengHaTeamRole
    Description: >
      Role players are signed in to their game account as. Must match
      ROLE_NAME in layers/utils-layer/team_role.py and PlayerRoleName in
      org/organization.yaml.

  AlertEmail:
    Type: String
    Default: leandro.lx3@gmail.com
    Description: >
      Where the alert goes when an account falls out of the pool, and the SES
      identity it is sent from. Sender and recipient are the same address on
      purpose: SES in the sandbox only delivers between verified identities,
      so one verification covers both ends. Cognito does not use this — it
      sends invitations and password resets with its own sender.

  SessionHours:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 720
    Description: >
      How long a sign-in lasts before the player has to authenticate again,
      second factor included. This is the refresh token's lifetime; the access
      and ID tokens keep the usual hour and are renewed from it.

  MfaEnforcement:
    Type: String
    Default: "ON"
    AllowedValues: ["OFF", "OPTIONAL", "ON"]
    Description: >
      An authenticator app is the only second factor enabled. With this ON,
      a user who has not enrolled one is walked through enrolling it on their
      next sign-in.

  MaxSessionHours:
    Type: Number
    Default: 3
    MinValue: 1
    Description: >
      How long a session may hold an account before the janitor tears it down.
      A player who closes the tab never ends their session, and an abandoned
      session is an account permanently out of the pool.

  AllowedOrigin:
    Type: String
    Default: ""
    Description: >
      The single origin allowed to read this API. Empty means the CloudFront
      distribution this stack creates, which is the right answer in all but
      one case: pointing a local dev server at the deployed API, where you
      would set it to http://localhost:8080 for as long as that lasts.

  MaxCleanupAttempts:
    Type: Number
    Default: 3
    MinValue: 1
    Description: >
      How many times a wipe may fail before a person is asked to look. Below
      that it is retried by the janitor, because the usual reason is AWS not
      having released something yet rather than a broken account.

  RetryCleanupAfterMinutes:
    Type: Number
    Default: 15
    MinValue: 1
    Description: >
      How long to leave a failed wipe alone before trying again. An ENI left
      by a Lambda in a VPC takes tens of minutes to be released, and until it
      is, the security group, the subnet and the VPC behind it cannot go.

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: >
      How long CloudWatch keeps this stack's logs. A log group created by
      Lambda on its own never expires, so without the groups declared below
      every invocation is billed storage forever against a 100 USD budget.

Conditions:
  UseOwnFrontend: !Equals [!Ref AllowedOrigin, ""]

Resources:

  UtilsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-utils-layer"
      Description: Shared utilities for game management including account_manager
      ContentUri: layers/utils-layer/
      CompatibleRuntimes:
        - python3.9
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.9

  GamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Games"
      AttributeDefinitions:
        - AttributeName: "id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "id"
          KeyType: "HASH"
      BillingMode: PAY_PER_REQUEST

  GameSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Game-Sessions"
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: user_name
          AttributeType: S
        - AttributeName: game_id
          AttributeType: S
        - AttributeName: account_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_game_index
          KeySchema:
            - AttributeName: user_name
              KeyType: HASH
            - AttributeName: game_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Used by the cleanup result handler to find the session a finished
        # build belongs to, which it only knows by account.
        - IndexName: account_index
          KeySchema:
            - AttributeName: account_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  # Pool of AWS accounts games get deployed into. One item per account, holding
  # the account's lifecycle state (AVAILABLE / IN_USE / CLEANING / QUARANTINED)
  # so an account being torn down is never handed to a new player.
  GameAccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Game-Accounts"
      AttributeDefinitions:
        - AttributeName: "account_id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "account_id"
          KeyType: "HASH"
      BillingMode: PAY_PER_REQUEST

  # Creating this sends a verification mail to the address. Until someone
  # clicks it, SES refuses to send and the quarantine alert only reaches the
  # Lambda's log. The state change itself is unaffected.
  AlertEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref AlertEmail

  GameProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Game-Progress"
      # One item per player per game, holding the two facts the chip is
      # derived from: whether they are playing it now, and whether they have
      # ever finished it. What happened inside a single attempt lives on the
      # session instead, and goes away with it.
      AttributeDefinitions:
        - AttributeName: user_email
          AttributeType: S
        - AttributeName: game_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_email
          KeyType: HASH
        - AttributeName: game_id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  GameAccessTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Game-Access"
      AttributeDefinitions:
        - AttributeName: "user_email"
          AttributeType: "S"
        - AttributeName: "game_id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "user_email"
          KeyType: "HASH"
        - AttributeName: "game_id"
          KeyType: "RANGE"
      BillingMode: PAY_PER_REQUEST

  GetGamesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/get_games/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GameProgressTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GamesTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccessTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /games
            Method: get
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  GetGameByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/get_game_by_id/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GameProgressTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GamesTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccessTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /games/{gameId}
            Method: get
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  GetGameSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/get_game_session/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - AWSCloudFormationFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccessTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccountsTable
        - Version: "2012-10-17"
          Statement:
            # Wildcard on the account, specific on the role name, confined to
            # this organization. Adding an account never touches this template.
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub "arn:aws:iam::*:role/${GameAccountRoleName}"
              Condition:
                StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /games/{gameId}/session
            Method: get
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  StartGameSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/start_game_session/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - AWSCloudFormationFullAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref GameProgressTable
        - DynamoDBReadPolicy:
            TableName: !Ref GamesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccessTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccountsTable
        - AmazonS3ReadOnlyAccess
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub "arn:aws:iam::*:role/${GameAccountRoleName}"
              Condition:
                StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /games/{gameId}/start
            Method: post
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  EndGameSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/end_game_session/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Environment:
        Variables:
          CLEANUP_PROJECT_NAME: !Ref AccountCleanupProject
      # No longer deletes the stack or reaches into the game account: it ends
      # the session and hands the account to the cleanup build.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameProgressTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccessTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccountsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: codebuild:StartBuild
              Resource: !GetAtt AccountCleanupProject.Arn
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${AlertEmail}"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub "arn:aws:iam::*:role/${GameAccountRoleName}"
              Condition:
                StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /games/{gameId}/end
            Method: post
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  SubmitTaskAnswerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/submit_task_answer/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameProgressTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GamesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccessTable
        # Which role to assume is stored per account. Without this the lookup
        # fails and every validation silently falls back to the default name.
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccountsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: "*"  # Allow invoking any lambda (validate_task functions)
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub "arn:aws:iam::*:role/${GameAccountRoleName}"
              Condition:
                StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /games/{gameId}/tasks/{taskId}/answer
            Method: post
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer


  GetAccountStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/get_account_status/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccountsTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /accounts/status
            Method: get
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  # Wipes a game account after its session ends. CloudFormation delete leaves
  # behind anything the player created or modified outside the stack, so the
  # account is swept instead of the stack being deleted.
  AccountCleanupProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-account-cleanup"
      Description: Runs aws-nuke against a single game account
      ServiceRole: !GetAtt AccountCleanupRole.Arn
      # Labs with databases, EKS clusters and the like take a long time to
      # tear down, so this is generous on purpose.
      TimeoutInMinutes: 60
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: TARGET_ACCOUNT
            Value: "unset"
          - Name: GAME_ACCOUNTS_TABLE
            Value: !Ref GameAccountsTable
          - Name: GAME_ACCOUNT_ROLE_NAME
            Value: !Ref GameAccountRoleName
          # Lives in the cloudraiser-games repo (nuke/aws-nuke.yaml) and gets
          # here with the normal games sync, so it is versioned alongside the
          # game templates rather than in this one.
          - Name: NUKE_CONFIG_S3
            Value: !Sub "s3://${S3BucketName}/nuke/aws-nuke.yaml"
          - Name: AWS_NUKE_VERSION
            Value: "3.68.3"
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - set -eu
                # Refuse to wipe an account the orchestrator has not put into
                # CLEANING. Without this, a hand-started build could sweep an
                # account that is mid-session.
                - |
                  STATUS=$(aws dynamodb get-item \
                      --table-name "$GAME_ACCOUNTS_TABLE" \
                      --key "{\"account_id\":{\"S\":\"$TARGET_ACCOUNT\"}}" \
                      --query 'Item.status.S' --output text)
                  if [ "$STATUS" != "CLEANING" ]; then
                    echo "Account $TARGET_ACCOUNT is '$STATUS', expected CLEANING. Refusing to run."
                    exit 1
                  fi
                - |
                  curl -sSLf -o /tmp/aws-nuke.tar.gz \
                    "https://github.com/ekristen/aws-nuke/releases/download/v${AWS_NUKE_VERSION}/aws-nuke-v${AWS_NUKE_VERSION}-linux-amd64.tar.gz"
                - tar -xzf /tmp/aws-nuke.tar.gz -C /usr/local/bin aws-nuke
                - aws s3 cp "$NUKE_CONFIG_S3" /tmp/base.yaml
                # The base config carries no account list; scope this run to
                # exactly the account we were handed.
                - |
                  { cat /tmp/base.yaml
                    printf '\naccounts:\n  "%s":\n    presets:\n      - access\n      - defaults\n' "$TARGET_ACCOUNT"
                    printf '\nbypass-alias-check-accounts:\n  - "%s"\n' "$TARGET_ACCOUNT"
                  } > /tmp/nuke.yaml
            build:
              # Two retries, not five. Anything still held after that is
              # being released by AWS on its own schedule, and the janitor
              # starts a fresh build later — waiting here means paying for a
              # container to sleep, which is how three 40-minute builds cost
              # more than the sessions they were cleaning up after.
              commands:
                - |
                  aws-nuke run -c /tmp/nuke.yaml \
                    --assume-role-arn "arn:aws:iam::${TARGET_ACCOUNT}:role/${GAME_ACCOUNT_ROLE_NAME}" \
                    --default-region us-east-1 \
                    --no-alias-check --no-prompt --no-dry-run \
                    --max-wait-retries 2 --quiet

  AccountCleanupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: account-cleanup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-account-cleanup*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/nuke/*"
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt GameAccountsTable.Arn
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:aws:iam::*:role/${GameAccountRoleName}"
                Condition:
                  StringEquals:
                    aws:ResourceOrgID: !Ref OrganizationId

  # The build itself never writes account state. This owns that transition, so
  # a build that times out or is stopped still releases or quarantines the
  # account instead of leaving it stuck in CLEANING forever.
  # CloudFormation publishes every lab stack's state changes here, because
  # start_game_session passes this topic as a NotificationARN. Before it, the
  # only thing that discovered a stack had finished was the player's page
  # asking, at the cost of an AssumeRole and a DescribeStacks per poll.
  StackEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-stack-events"

  # Only stacks the orchestrator itself created can publish here. A
  # subscription filter cannot do this job: CloudFormation sends no message
  # attributes and its body is plain text rather than JSON, so neither
  # filter scope has anything to match on. Narrowing the publisher closes
  # the same hole earlier, at the topic instead of after delivery.
  #
  # CreateStack checks the *caller* can publish and fails with a 403 if it
  # cannot, so a wrong policy breaks starting a game loudly rather than
  # losing events quietly. Scoped to the organisation as well, like the
  # artefacts bucket, so a pool account added later needs no change here.
  #
  # Principals of this account are not covered: inside the owning account an
  # identity policy grants access on its own, whatever this says. That is
  # unavoidable and harmless — the account is ours.
  StackEventsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref StackEventsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StacksInsideTheOrganisation
            Effect: Allow
            Principal:
              AWS: "*"
            Action: sns:Publish
            Resource: !Ref StackEventsTopic
            Condition:
              StringEquals:
                aws:PrincipalOrgID: !Ref OrganizationId
              ArnLike:
                aws:PrincipalArn: !Sub "arn:aws:iam::*:role/${GameAccountRoleName}"

  StackEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/stack_events/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccountsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub "arn:aws:iam::*:role/${GameAccountRoleName}"
              Condition:
                StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
      Architectures:
        - x86_64
      Events:
        StackEvent:
          Type: SNS
          Properties:
            Topic: !Ref StackEventsTopic


  CleanupResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          MAX_CLEANUP_ATTEMPTS: !Sub "${MaxCleanupAttempts}"
      CodeUri: games/cleanup_result/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${AlertEmail}"
      Architectures:
        - x86_64
      Events:
        BuildStateChange:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.codebuild
              detail-type:
                - CodeBuild Build State Change
              detail:
                project-name:
                  - !Sub "${AWS::StackName}-account-cleanup"
                build-status:
                  - SUCCEEDED
                  - FAILED
                  - STOPPED
                  - TIMED_OUT

  # Nothing ends a session when a player just closes the tab, and an account
  # held by an abandoned session never comes back on its own. This sweeps them
  # through exactly the same teardown the player's "end" button triggers.
  SessionJanitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/session_janitor/
      Handler: app.lambda_handler
      Runtime: python3.9
      # A sweep can start several builds in a row, which the 30s default in
      # Globals is too tight for.
      Timeout: 120
      Layers:
        - !Ref UtilsLayer
      Environment:
        Variables:
          CLEANUP_PROJECT_NAME: !Ref AccountCleanupProject
          MAX_SESSION_HOURS: !Sub "${MaxSessionHours}"
          MAX_CLEANUP_ATTEMPTS: !Sub "${MaxCleanupAttempts}"
          RETRY_CLEANUP_AFTER_MINUTES: !Sub "${RetryCleanupAfterMinutes}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameProgressTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccountsTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: codebuild:StartBuild
              Resource: !GetAtt AccountCleanupProject.Arn
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${AlertEmail}"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub "arn:aws:iam::*:role/${GameAccountRoleName}"
              Condition:
                StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
      Architectures:
        - x86_64
      Events:
        Sweep:
          Type: Schedule
          Properties:
            # A session therefore lives somewhere between MaxSessionHours
            # and 30 minutes past it, which is close enough for a 3h cap.
            Schedule: rate(30 minutes)
            Description: Expire game sessions that outlived MaxSessionHours

  # Cognito says who the caller is; this says whether they still hold the
  # account, and only then trades that for a console session. Sessions last
  # an hour: assuming a role from a Lambda is role chaining, which AWS caps
  # there. The console sends the player to FRONTEND_URL/reconnect when it
  # expires, and that page asks for a fresh URL.
  ConsoleAccessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/console_access/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Environment:
        Variables:
          FRONTEND_URL: !Sub "https://${CloudFrontDistribution.DomainName}"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccessTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameAccountsTable
        - Version: "2012-10-17"
          Statement:
            # The player's role, not the orchestrator's: this session is the
            # person, and CloudTrail in the game account records it as them.
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub "arn:aws:iam::*:role/${PlayerRoleName}"
              Condition:
                StringEquals:
                  aws:ResourceOrgID: !Ref OrganizationId
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /games/{gameId}/console
            Method: post
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

# --- Log retention ----------------------------------------------------------
# Lambda and CodeBuild create their own log groups on first write, with no
# expiry. Declaring them here is the only way to put a retention on them, and
# naming each one after its function (!Sub on the logical id resolves to the
# generated function name) keeps every function's logs in their own group.
#
# A group that already exists is not imported: CloudFormation fails the
# create. If a deploy stops on one, delete that group and deploy again.

  GetGamesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetGamesFunction}"
      RetentionInDays: !Ref LogRetentionDays

  GetGameByIdLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetGameByIdFunction}"
      RetentionInDays: !Ref LogRetentionDays

  GetGameSessionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetGameSessionFunction}"
      RetentionInDays: !Ref LogRetentionDays

  StartGameSessionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StartGameSessionFunction}"
      RetentionInDays: !Ref LogRetentionDays

  EndGameSessionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EndGameSessionFunction}"
      RetentionInDays: !Ref LogRetentionDays

  SubmitTaskAnswerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SubmitTaskAnswerFunction}"
      RetentionInDays: !Ref LogRetentionDays

  GetAccountStatusLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetAccountStatusFunction}"
      RetentionInDays: !Ref LogRetentionDays

  CleanupResultLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CleanupResultFunction}"
      RetentionInDays: !Ref LogRetentionDays

  SessionJanitorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SessionJanitorFunction}"
      RetentionInDays: !Ref LogRetentionDays

  StackEventsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StackEventsFunction}"
      RetentionInDays: !Ref LogRetentionDays

  AdminUsersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AdminUsersFunction}"
      RetentionInDays: !Ref LogRetentionDays

  AnalyticsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AnalyticsFunction}"
      RetentionInDays: !Ref LogRetentionDays

  ConsoleAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ConsoleAccessFunction}"
      RetentionInDays: !Ref LogRetentionDays

  # The cleanup build names itself, so this group is named the same way
  # CodeBuild would have named it.
  AccountCleanupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}-account-cleanup"
      RetentionInDays: !Ref LogRetentionDays

  # One function behind every /admin route. These operations are rare and
  # share a policy; six functions would have been six log groups and six
  # copies of the same Cognito permissions for no gain.
  AdminUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/admin_users/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Environment:
        Variables:
          USER_POOL_ID: !Ref CognitoUserPool
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameAccessTable
        - DynamoDBReadPolicy:
            TableName: !Ref GamesTable
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminSetUserMFAPreference
              # This pool and no other. Deleting a user is deliberately not
              # here: disabling covers the real case and keeps the history.
              Resource: !GetAtt CognitoUserPool.Arn
      Architectures:
        - x86_64
      Events:
        ListCatalogue:
          Type: Api
          Properties:
            Path: /admin/games
            Method: get
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer
        ListUsers:
          Type: Api
          Properties:
            Path: /admin/users
            Method: get
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer
        CreateUser:
          Type: Api
          Properties:
            Path: /admin/users
            Method: post
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer
        UpdateUser:
          Type: Api
          Properties:
            Path: /admin/users/{email}
            Method: patch
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer
        ResetMfa:
          Type: Api
          Properties:
            Path: /admin/users/{email}/reset-mfa
            Method: post
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer
        ListGrants:
          Type: Api
          Properties:
            Path: /admin/users/{email}/games
            Method: get
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer
        SetGrants:
          Type: Api
          Properties:
            Path: /admin/users/{email}/games
            Method: put
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: games/analytics/
      Handler: app.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref UtilsLayer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GameSessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameProgressTable
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /analytics
            Method: get
            RestApiId: !Ref RestApi
            Auth:
              Authorizer: CognitoAuthorizer

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,PATCH,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: !If
          - UseOwnFrontend
          - !Sub "'https://${CloudFrontDistribution.DomainName}'"
          - !Sub "'${AllowedOrigin}'"
      # API Gateway answers some requests without reaching a handler, and
      # those answers carried no CORS header at all. The one that bites is
      # UNAUTHORIZED: the browser hides a 401 it cannot read, so the front's
      # fetch rejects as a network error and the refresh-and-retry it has
      # for exactly this case never sees a status to act on.
      GatewayResponses:
        UNAUTHORIZED:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !If
                - UseOwnFrontend
                - !Sub "'https://${CloudFrontDistribution.DomainName}'"
                - !Sub "'${AllowedOrigin}'"
        ACCESS_DENIED:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !If
                - UseOwnFrontend
                - !Sub "'https://${CloudFrontDistribution.DomainName}'"
                - !Sub "'${AllowedOrigin}'"
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !If
                - UseOwnFrontend
                - !Sub "'https://${CloudFrontDistribution.DomainName}'"
                - !Sub "'${AllowedOrigin}'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !If
                - UseOwnFrontend
                - !Sub "'https://${CloudFrontDistribution.DomainName}'"
                - !Sub "'${AllowedOrigin}'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-OAC"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Action:
              - s3:GetObject
            Effect: Allow
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"
            Principal:
              Service: cloudfront.amazonaws.com
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_100

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      AutoVerifiedAttributes:
        - email

      # Email is free to be the way back in when a password is lost, because
      # the second factor below is an authenticator app and not the mailbox.
      # Cognito's own sender handles these, so the pool needs no SES identity
      # and is not held back by the SES sandbox.
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

      # An authenticator app, deliberately not email: a code in a mailbox is
      # only as strong as the mailbox, and sending it would have meant SES
      # production access and a domain we do not have.
      MfaConfiguration: !Ref MfaEnforcement
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA

  FullAccessUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref CognitoUserPool
      GroupName: full-access
      Description: Users who can see and play every game, bypassing per-game access grants

  # Separate from full-access on purpose: administering the platform and
  # being allowed to play every game are two grants. An administrator who
  # should also see the whole catalogue belongs to both groups.
  AdminUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref CognitoUserPool
      GroupName: admin
      Description: Users who can manage other users and open the admin area

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: !Sub "${AWS::StackName}-user-pool-client"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # The refresh token is what decides how long a sign-in survives: once it
      # expires the player authenticates again, second factor included. The
      # short-lived tokens are renewed from it in the meantime.
      RefreshTokenValidity: !Ref SessionHours
      AccessTokenValidity: 1
      IdTokenValidity: 1
      TokenValidityUnits:
        RefreshToken: hours
        AccessToken: hours
        IdToken: hours

Outputs:
  GamesApi:
    Description: "API Gateway endpoint URL for Prod stage for Games functions"
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/games/"

  BucketName:
    Description: "S3 bucket for the frontend"
    Value: !Ref FrontendBucket

  BucketURL:
    Description: "URL for the frontend"
    Value: !GetAtt FrontendBucket.WebsiteURL

  CloudFrontURL:
    Description: "CloudFront URL for the frontend"
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref CognitoUserPool

  UserPoolClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref CognitoUserPoolClient