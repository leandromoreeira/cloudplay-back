# aws-nuke configuration for recycling game accounts.
#
# Dry run (lists what WOULD be deleted, deletes nothing):
#   aws-nuke run -c nuke/aws-nuke.yaml \
#       --assume-role-arn arn:aws:iam::<account>:role/<role>
#
# For real, add: --no-dry-run --no-prompt
#
# Only accounts listed under `accounts:` can be touched at all, and the
# management account is blocklisted, so a wrong --assume-role-arn fails
# closed instead of destroying the platform.

regions:
  - global
  - us-east-1

# aws-nuke refuses to run with an empty blocklist. This is the account the
# orchestrator, the games table and the frontend live in — never nuke it.
blocklist:
  - "673000199571"

# These accounts have no account alias set; aws-nuke otherwise refuses to
# run as a safety measure.
bypass-alias-check-accounts:
  - "339105149717"
  - "021914682333"

accounts:
  # Retired accounts, kept here while they are being decommissioned.
  "339105149717":
    presets:
      - access
      - defaults
  "021914682333":
    presets:
      - access
      - defaults

settings:
  CloudFormationStack:
    DisableDeletionProtection: true
  EC2Instance:
    DisableStopProtection: true
    DisableDeletionProtection: true
  RDSInstance:
    DisableDeletionProtection: true
  DynamoDBTable:
    DisableDeletionProtection: true

resource-types:
  excludes:
    # Deleting the bucket takes its objects with it
    - S3Object
    # Retired services whose endpoints no longer answer. Listing them just
    # burns minutes waiting for connection timeouts on every run.
    - CodeStarProject
    - CodeStarConnection
    - CodeStarNotification
    - InspectorAssessmentRun
    - InspectorAssessmentTarget
    - InspectorAssessmentTemplate
    - ElasticTranscoderPipeline
    - ElasticTranscoderPreset
    - OpsWorksCMBackup
    - OpsWorksCMServer
    - OpsWorksCMServerState
    - OpsWorksApp
    - OpsWorksInstance
    - OpsWorksLayer
    - OpsWorksUserProfile
    - Cloud9Environment
    - CloudSearchDomain
    - MachineLearningMLModel
    - MachineLearningDataSource
    - MachineLearningBranchPrediction
    - MachineLearningEvaluation

presets:
  # Without this the nuke deletes the very role it is being run through,
  # and the account becomes unreachable. The SCP in org/organization.yaml
  # blocks this too, for accounts that are in the guardrail OU.
  access:
    filters:
      IAMRole:
        - property: Name
          type: contains
          value: "OrganizationAccountAccessRole"
        - property: Name
          type: contains
          value: "CloudPlayGameRole"
      IAMRolePolicy:
        - property: role:RoleName
          type: contains
          value: "OrganizationAccountAccessRole"
        - property: role:RoleName
          type: contains
          value: "CloudPlayGameRole"
      IAMRolePolicyAttachment:
        - property: RoleName
          type: contains
          value: "OrganizationAccountAccessRole"
        - property: RoleName
          type: contains
          value: "CloudPlayGameRole"

  # Recreating default VPCs is slow and games assume one exists.
  defaults:
    filters:
      EC2Subnet:
        - property: DefaultVPC
          value: "true"
      EC2DefaultSecurityGroupRule:
        - property: DefaultVPC
          value: "true"
      EC2DHCPOption:
        - property: DefaultVPC
          value: "true"
      EC2VPC:
        - property: IsDefault
          value: "true"
      EC2InternetGateway:
        - property: DefaultVPC
          value: "true"
      EC2InternetGatewayAttachment:
        - property: DefaultVPC
          value: "true"
      EC2RouteTable:
        - property: DefaultVPC
          value: "true"
